apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
spec:
  project: default
  source: 
    chart: external-dns
    repoURL: https://kubernetes-sigs.github.io/external-dns/
    targetRevision: "1.24.0"
    helm: 
      valuesObject: 
        provider:
          name: "aws" 
        domainFilters: ["eks.awaiscloud.click"]
        sources: ["ingress"]
        policy: sync
        txtOwnerId: "eks-memos"

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
      automated:
        selfHeal: true
        prune: true
  