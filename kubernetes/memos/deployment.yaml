apiVersion: apps/v1
kind: Deployment
metadata:
  name: memos-deployment
  labels:
    app: memos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: memos
  template:
    metadata:
      labels:
        app: memos
    spec:
      containers:
      - name: memos
        image: 594566440241.dkr.ecr.eu-west-2.amazonaws.com/eks-memos:pending-build
        ports:
        - containerPort: 8081
        env: 
          - name: MEMOS_DRIVER
            value: postgres 
          - name: MEMOS_DSN
            valueFrom: 
              secretKeyRef: 
                name: memos-db
                key: dsn
        readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
  